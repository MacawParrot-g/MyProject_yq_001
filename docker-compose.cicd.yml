version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tds-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: test_data
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "13306:3305"    # 宿主机 13306 → 容器内 3305（非默认端口）
    volumes:
      - ./persistent-data/mysql:/var/lib/mysql
      - ./mysql/initsql:/docker-entrypoint-initdb.d
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - traffic-data-system-dev-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tds-redis
    restart: always
    command: redis-server --appendonly yes --port 6380
    ports:
      - "16379:6380"    # 宿主机 16380 → 容器内 6380（非默认端口）
    volumes:
      - ./persistent-data/redis:/data
    networks:
      - traffic-data-system-dev-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: tds-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - ./persistent-data/rabbitmq:/var/lib/rabbitmq
    networks:
      - traffic-data-system-dev-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    ports:
    # 将宿主机端口从 8080 改为 8082
    - "8082:8082"
    image: myapp-backend:latest
#    build:
#      context: ./backend
#      dockerfile: Dockerfile
    container_name: tds-backend
    restart: always
    env_file:
      - .env 
    volumes:
      - ./persistent-data/export:/data/export
    environment:
   #   SPRING_PROFILES_ACTIVE: prod
      # MySQL：容器内仍用 3305，通过服务名 'mysql' 访问
  #    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3305/test_data?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
   #   SPRING_DATASOURCE_USERNAME: remote_user
   #   SPRING_DATASOURCE_PASSWORD: 12345678
      # Redis：容器内改为 6380，通过服务名 'redis' 访问
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6380
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - traffic-data-system-dev-net

  nginx:
    image: nginx:1.21-alpine
    container_name: tds-nginx
    restart: always
    
    # 【终极修复】1. 先清空挂载目录里的旧文件；2. 强制把新文件的所有者改为 www-data(101)；3. 启动 Nginx
    entrypoint: ["/bin/sh", "-c", "chown -R 101:101 /usr/share/nginx/html && exec nginx -g 'daemon off;'"]
    
    ports:
      - "19203:19203"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
      - ./persistent-data/nginx-logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - traffic-data-system-dev-net

networks:
  traffic-data-system-dev-net:
    driver: bridge
