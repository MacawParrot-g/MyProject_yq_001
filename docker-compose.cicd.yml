version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cicd-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: test_data
      MYSQL_USER: remote_user
      MYSQL_PASSWORD: 12345678
      TZ: Asia/Shanghai
    ports:
      - "13306:3305"    # 宿主机 13306 → 容器内 3305（非默认端口）
    volumes:
      - ./cicd-data/mysql:/var/lib/mysql
      - ./mysql/initsql:/docker-entrypoint-initdb.d
    networks:
      - cicd-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cicd-redis
    restart: always
    command: redis-server --appendonly yes --port 6380
    ports:
      - "16379:6380"    # 宿主机 16380 → 容器内 6380（非默认端口）
    volumes:
      - ./cicd-data/redis:/data
    networks:
      - cicd-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cicd-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 91781369
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - ./cicd-data/rabbitmq:/var/lib/rabbitmq
    networks:
      - cicd-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cicd-backend
    restart: always
    volumes:
      - ./cicd-data/export:/data/export
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # MySQL：容器内仍用 3305，通过服务名 'mysql' 访问
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3305/test_data?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: remote_user
      SPRING_DATASOURCE_PASSWORD: 12345678
      # Redis：容器内改为 6380，通过服务名 'redis' 访问
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6380
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cicd-network

  nginx:
    image: nginx:1.21-alpine
    container_name: cicd-nginx
    restart: always
    ports:
      - "19203:19203"   # 宿主机 19203 → 容器内 19203
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
      - ./cicd-data/nginx-logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - cicd-network

networks:
  cicd-network:
    driver: bridge
