version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cicd-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: test_data
      # 【修复1】显式创建后端需要的用户，防止连接被拒
      MYSQL_USER: remote_user
      MYSQL_PASSWORD: 12345678
      TZ: Asia/Shanghai
    volumes:
      # 【优化】使用独立目录，防止与生产环境数据权限冲突
      - ./cicd-data/mysql:/var/lib/mysql
      - ./mysql/initsql:/docker-entrypoint-initdb.d
    networks:
      - cicd-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345678"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cicd-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./cicd-data/redis:/data
    networks:
      - cicd-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cicd-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 91781369
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - ./cicd-data/rabbitmq:/var/lib/rabbitmq
    networks:
      - cicd-network
    # 【修复2】补全健康检查，否则后端 depends_on 会失效
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cicd-backend
    restart: always
    volumes:
      - ./cicd-data/export:/data/export
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 注意：这里的主机名必须是服务名 'mysql'，不能用 localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_data?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: remote_user
      SPRING_DATASOURCE_PASSWORD: 12345678
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cicd-network

  nginx:
    image: nginx:1.21-alpine
    container_name: cicd-nginx
    restart: always
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
      - ./cicd-data/nginx-logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - cicd-network

networks:
  cicd-network:
    driver: bridge
