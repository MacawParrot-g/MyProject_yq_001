version: '3.8'

services:
  # 1. MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: prod-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345678  # 设置root密码
      MYSQL_DATABASE: test_data        # 初始化数据库名
      TZ: Asia/Shanghai                         # 时区设置
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql             # 数据持久化
      - ./mysql/initsql:/docker-entrypoint-initdb.d  # 自动执行初始化SQL
    networks:
      - prod-network
    healthcheck:                                # 健康检查
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pYourStrongPassword!"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: prod-redis
    restart: always
    command: redis-server --appendonly yes      # 开启AOF持久化
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data                      # 数据持久化
    networks:
      - prod-network
    healthcheck:                                # 健康检查
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Spring Boot 后端服务
  backend:
    build:
      context: ./backend                        # 指定Dockerfile所在目录
      dockerfile: Dockerfile
    container_name: prod-backend
    restart: always
    ports:
     - "8080:8080"                             # 暴露后端端口
    volumes:
     - ./data/export:/data/export
    environment:
      SPRING_PROFILES_ACTIVE: prod              # 激活生产环境配置
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/test_data?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: remote_user
      SPRING_DATASOURCE_PASSWORD: 12345678
      SPRING_REDIS_HOST: redis                  # 通过服务名直接访问Redis
      SPRING_REDIS_PORT: 6379
    depends_on:                                 # 依赖控制：确保数据库和缓存健康后再启动
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - prod-network

  # 4. Nginx 前端与反向代理服务
  nginx:
    image: nginx:1.21-alpine
    container_name: prod-nginx
    restart: always
    ports:
      - "80:80"                                 # 对外暴露80端口
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d        # 挂载Nginx配置
      - ./nginx/html:/usr/share/nginx/html      # 挂载前端打包后的dist文件
      - ./nginx/logs:/var/log/nginx             # 挂载日志目录
    depends_on:
      - backend                                 # 依赖后端服务
    networks:
      - prod-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: prod-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data:/var/lib/rabbitmq
      - ./conf:/etc/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 91781369
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - prod-network
# 自定义桥接网络，确保所有容器在同一局域网内通过服务名通信
networks:
  prod-network:
    driver: bridge

