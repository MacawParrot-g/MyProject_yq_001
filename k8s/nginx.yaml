apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
        # 1. 初始化容器：负责把前端页面搬给 Nginx
        - name: frontend-copy
          image: macawparrot-g/frontend:latest # 必须换成你前端镜像的仓库地址
          command: ["/bin/sh", "-c"]
          args: ["cp -r /usr/share/nginx/html/* /app/"]
          volumeMounts:
            - name: frontend-volume
              mountPath: /app
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: frontend-volume
              mountPath: /usr/share/nginx/html # Nginx默认页面目录
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: frontend-volume
          emptyDir: {} # 用于在容器间共享前端页面文件
        - name: nginx-conf
          configMap:
            name: nginx-config # 引用下面的 ConfigMap
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: NodePort # 关键：将端口映射到宿主机
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 19302 # 映射到宿主机 19302 端口
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 代理后端 API 请求
        location /api/ {
            proxy_pass http://backend-service:8080/;
        }
    }
  nginx.conf: |
    worker_processes auto;
    events {
        worker_connections 1024;
    }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;
        include /etc/nginx/conf.d/*.conf;
    }
