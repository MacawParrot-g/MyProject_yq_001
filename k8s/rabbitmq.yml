apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30672 # 测试服端口：30672
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 31672 # 管理后台端口：31672
  selector:
    app: rabbitmq
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: "admin"
        - name: RABBITMQ_DEFAULT_PASS
          value: "91781369"
        ports:
        - containerPort: 5672
        - containerPort: 15672
